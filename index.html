<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
<div class="wrapper">
    <header class="header">
        <div class="container">
            <div class="header__inner">
                <a class="logo" href="#">
                    <img class="logo__img" src="img/Frame%2085.svg" alt="">
                </a>
                <nav class="menu">
                    <ul class="menu__list">
                        <li class="menu__list-item">
                            <a href="#" class="menu__list-link">Продукция</a>
                        </li>
                        <li class="menu__list-item">
                            <a href="#" class="menu__list-link">Материалы</a>
                        </li>
                        <li class="menu__list-item">
                            <a href="#" class="menu__list-link">О нас</a>
                        </li>
                        <li class="menu__list-item">
                            <a href="#" class="menu__list-link">Контакты</a>
                        </li>
                    </ul>
                </nav>
                <div class="header__icons">
                    <img class="search__icon" src="img/search.svg" alt="Поиск">
                    <img class="login__icon" src="img/status=default.svg" alt="Вход">
                </div>
            </div>
        </div>
    </header>
    <main class="main">
        <section class="top">
            <div class="container top__container">
                <div class="top__text">
                    <h1 class="title">Простые вещи. Из бумаги.</h1>
                    <p class="description">
                        Бума́га (предположительно от итал. bombagia, первоисточником же считается иранский) — волокнистый материал с минеральными добавками.
                    </p>
                    <img class="logo__catalog" src="img/1status=default.svg" alt="">
                </div>
                <div class="top__image">
                    <img class="paper__photo" src="img/Layer%202%201copy.svg" alt="">
                </div>
            </div>
        </section>

    </main>
    <footer class="footer">
        <div class="footer__inner">
            <a class="logo__footer" href="#">
                <img class="logo__footer__img" src="img/Frame%20856.svg" alt="Логотип">
            </a>
            <div class="footer__icons">
                <img src="img/FrameFB.svg" alt="Facebook">
                <img src="img/VectorIG.svg" alt="Instagram">
                <img src="img/VectorX.svg" alt="Twitter">
                <img src="img/VectorYT.svg" alt="YouTube">
            </div>
        </div>
    </footer>
    <p class="company__name">
        SIMPLE <span class="company__reg">®</span> 2021
    </p>
</div>
</body>
</html>
